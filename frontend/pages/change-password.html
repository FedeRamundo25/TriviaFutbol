<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña · TriviaFútbol</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main class="card">
    <div class="logo">Trivia<span>Fútbol</span> ⚽</div>
    <h2>Cambiar contraseña</h2>

    <p class="subtitle" id="changePasswordHint">Ingresá tu contraseña actual y elegí una nueva.</p>

    <form id="changePasswordForm">
      <div class="input-group">
        <label for="currentPassword">Contraseña actual</label>
        <input id="currentPassword" type="password" autocomplete="current-password" required>
      </div>
      <div class="input-group">
        <label for="newPassword">Nueva contraseña</label>
        <input id="newPassword" type="password" minlength="6" maxlength="100" autocomplete="new-password" required>
      </div>
      <div class="input-group">
        <label for="confirmPassword">Repetí la nueva contraseña</label>
        <input id="confirmPassword" type="password" minlength="6" maxlength="100" autocomplete="new-password" required>
      </div>
      <div class="error-msg" id="changePasswordError" role="alert"></div>
      <br>
      <button class="btn btn-azul" type="submit">Guardar contraseña</button>
    </form>

    <br>
    <a class="btn btn-ghost" href="index.html">← Volver</a>
  </main>

  <script src="js/api.js"></script>
  <script>
    async function init() {
      const user = await api.getMe();
      if (!user) {
        window.location.replace('login.html');
        return;
      }

      if (user.force_password_reset) {
        document.getElementById('changePasswordHint').textContent =
          'Tu administrador te dio una contraseña temporal. Cambiala para continuar.';
      }
    }

    document.getElementById('changePasswordForm').addEventListener('submit', async event => {
      event.preventDefault();
      const errorEl = document.getElementById('changePasswordError');
      errorEl.classList.remove('visible');

      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        errorEl.textContent = 'Las nuevas contraseñas no coinciden.';
        errorEl.classList.add('visible');
        return;
      }

      const result = await api.changePassword(currentPassword, newPassword);
      if (result.error) {
        errorEl.textContent = result.error;
        errorEl.classList.add('visible');
        return;
      }

      localStorage.removeItem('token');
      window.location.href = 'login.html?passwordChanged=1';
    });

    init();
  </script>
</body>
</html>

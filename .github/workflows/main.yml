name: Pipeline de Trivia Futbol (Test + Deploy)

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Ejecutar Tests de Calidad
    runs-on: ubuntu-latest
    
    # VOLVEMOS A LEVANTAR LA DB PARA EL TEST DE INTEGRACIÓN
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user_test
          POSTGRES_PASSWORD: password_test
          POSTGRES_DB: trivia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci
        working-directory: ./backend

      - name: Aplicar migraciones de base de datos
        run: npm run migrate
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://user_test:password_test@localhost:5432/trivia_test

      - name: Cargar datos de prueba
        run: npm run seed
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://user_test:password_test@localhost:5432/trivia_test
          JWT_SECRET: test_secret_key_123
          COOKIE_SECRET: una_cookie_secreta_para_test_ci
          NODE_ENV: test

      - name: Correr Tests con Cobertura
        env:
          DATABASE_URL: postgresql://user_test:password_test@localhost:5432/trivia_test
          JWT_SECRET: test_secret_key_123
          COOKIE_SECRET: una_cookie_secreta_para_test_ci
          NODE_ENV: test
        run: npm run test:coverage
        working-directory: ./backend

      - name: Subir Reporte de Cobertura
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/coverage/

      - name: Instalar navegador para pruebas E2E
        run: npx playwright install --with-deps chromium
        working-directory: ./backend

      - name: Ejecutar prueba E2E en navegador
        run: npm run test:e2e
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://user_test:password_test@localhost:5432/trivia_test
          JWT_SECRET: test_secret_key_123
          COOKIE_SECRET: una_cookie_secreta_para_test_ci
          NODE_ENV: test

      - name: Guardar trazas E2E si hay errores
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: backend/test-results/
          if-no-files-found: ignore

  deploy:
    name: Desplegar a Render
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Ejecutar Deploy en Render
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
